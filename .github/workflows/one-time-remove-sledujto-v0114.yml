name: Remove SledujTo v0.1.14

on:
  push:
    branches: [Master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove SledujTo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('api/sktonline.js')
          s = p.read_text()
          s = s.replace("const SLEDUJTETO_BASE_URL = 'https://www.sledujteto.cz';\n", '')
          s = s.replace("const sledujtetoHttp = makeHttp(SLEDUJTETO_BASE_URL, 9000);\n", '')

          def remove_between(text, start, end):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'missing start marker: {start}')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'missing end marker: {end}')
              return text[:a] + text[b:]

          s = remove_between(s, 'function isSledujToUrl(url) {', 'function isSktOnlineUrl(url) {')
          s = remove_between(s, 'function sledujtetoFileId(pageUrl, $, html) {', 'function onlineSearchItemsFromHtml($, wantedTitles) {')
          s = remove_between(s, 'async function streamsFromSledujSearch(searchUrl, titles, referer) {', 'async function streamsFromSktorrentDetail(candidate, client = null) {')

          old_detail = '''    const links = urlsFromHtml($, response.data, finalUrl);
              const sledujLinks = links.filter(url => isSledujToUrl(url) && /\\/file\\/\\d+/i.test(url));
              const sledujSearchLinks = links.filter(url => isSledujToUrl(url) && /\\/vyhledat\\//i.test(url));
              const onlineEntries = onlineEmbedEntriesFromDetail($, finalUrl, title, response.data);
              const detailVideoId = onlineVideoIdFromHtml($, response.data);
              const onlineDirectLinks = links.filter(url => isSktOnlineUrl(url) && isPlayableMediaUrl(url));

              const [sledujBatches, onlineBatches] = await Promise.all([
                Promise.all([
                  ...sledujLinks.slice(0, 4).map(url => streamsForSledujteto(url, finalUrl)),
                  ...sledujSearchLinks.slice(0, 2).map(url => streamsFromSledujSearch(url, [title], finalUrl))
                ]),
                Promise.all([
                  ...(detailVideoId ? [streamsForKnownOnlineVideoId(detailVideoId, title)] : []),
                  ...onlineEntries.slice(0, 6).map(entry => streamsForOnlinePage(entry.url, finalUrl, entry.title || title)),
                  ...onlineDirectLinks.slice(0, 4).map(url => Promise.resolve([makeStream('SKTOnline', title, url, '', finalUrl)]))
                ])
              ]);

              streams.push(...sledujBatches.flat(), ...onlineBatches.flat());'''.replace('              ', '    ')
          new_detail = '''    const links = urlsFromHtml($, response.data, finalUrl);
              const onlineEntries = onlineEmbedEntriesFromDetail($, finalUrl, title, response.data);
              const detailVideoId = onlineVideoIdFromHtml($, response.data);
              const onlineDirectLinks = links.filter(url => isSktOnlineUrl(url) && isPlayableMediaUrl(url));

              const onlineBatches = await Promise.all([
                ...(detailVideoId ? [streamsForKnownOnlineVideoId(detailVideoId, title)] : []),
                ...onlineEntries.slice(0, 6).map(entry => streamsForOnlinePage(entry.url, finalUrl, entry.title || title)),
                ...onlineDirectLinks.slice(0, 4).map(url => Promise.resolve([makeStream('SKTOnline', title, url, '', finalUrl)]))
              ]);

              streams.push(...onlineBatches.flat());'''.replace('              ', '    ')
          if old_detail not in s:
              raise SystemExit('SKTorrent detail SledujTo block did not match')
          s = s.replace(old_detail, new_detail)

          old_bundle = '''  const [fromDirectOnline, fromTorrentDetails, sledujToByTitle] = await Promise.all([
            directProviderWithin(findDirectOnlineByTitle(queries, titles), 18000, 'SKTOnline title search'),
            directProviderWithin(findFromSktorrentDetails(queries, titles, imdbId, sktClient), 18000, 'SKTorrent detail players'),
            directProviderWithin(findSledujtetoByTitle(queries, titles), 12000, 'SledujTo title search')
          ]);

          const resolvedAll = dedupeStreams([
            ...fromDirectOnline,
            ...fromTorrentDetails,
            ...sledujToByTitle
          ]).slice(0, 48);'''
          new_bundle = '''  const [fromDirectOnline, fromTorrentDetails] = await Promise.all([
            directProviderWithin(findDirectOnlineByTitle(queries, titles), 18000, 'SKTOnline title search'),
            directProviderWithin(findFromSktorrentDetails(queries, titles, imdbId, sktClient), 18000, 'SKTorrent detail players')
          ]);

          const resolvedAll = dedupeStreams([
            ...fromDirectOnline,
            ...fromTorrentDetails
          ]).slice(0, 48);'''
          if old_bundle not in s:
              raise SystemExit('bundle SledujTo block did not match')
          s = s.replace(old_bundle, new_bundle)
          p.write_text(s)

          p = Path('addon.js')
          s = p.read_text()
          s = s.replace("    cs: { name: 'SKTOnline + SledujTo + SKTorrent', description: 'Přímé streamy ze SKTOnline a SledujTo plus volitelné SKTorrent P2P torrenty.' },", "    cs: { name: 'SKTOnline + SKTorrent', description: 'Přímé streamy ze SKTOnline plus volitelné SKTorrent P2P torrenty.' },")
          s = s.replace("    sk: { name: 'SKTOnline + SledujTo + SKTorrent', description: 'Priame streamy zo SKTOnline a SledujTo plus voliteľné SKTorrent P2P torrenty.' },", "    sk: { name: 'SKTOnline + SKTorrent', description: 'Priame streamy zo SKTOnline plus voliteľné SKTorrent P2P torrenty.' },")
          s = s.replace("    en: { name: 'SKTOnline + SledujTo + SKTorrent', description: 'Direct SKTOnline and SledujTo streams plus optional SKTorrent P2P torrents.' }", "    en: { name: 'SKTOnline + SKTorrent', description: 'Direct SKTOnline streams plus optional SKTorrent P2P torrents.' }")
          s = s.replace("    name: 'SKTOnline + SledujTo + SKTorrent',", "    name: 'SKTOnline + SKTorrent',")
          s = s.replace("    providers: ['SKTOnline direct search', 'SKTOnline players from SKTorrent details', 'SledujTo', 'SKTorrent P2P', 'Sosac ID overlay'],", "    providers: ['SKTOnline direct search', 'SKTOnline players from SKTorrent details', 'SKTorrent P2P', 'Sosac ID overlay'],")
          p.write_text(s)

          p = Path('public/configure.html')
          s = p.read_text()
          s = s.replace('SKTOnline + SledujTo + SKTorrent pro Stremio', 'SKTOnline + SKTorrent pro Stremio')
          s = s.replace('SKTOnline + SledujTo + SKTorrent', 'SKTOnline + SKTorrent')
          s = s.replace('        <div class="source"><strong>SledujTo</strong><span>Přímý odkaz získaný z nalezené stránky. Video nejde přes náš server.</span></div>\n', '')
          p.write_text(s)

          p = Path('package.json')
          pkg = json.loads(p.read_text())
          pkg['version'] = '0.1.14'
          pkg['description'] = 'Stremio addon for direct SKTOnline streams and optional SKTorrent P2P.'
          p.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: |
          set -euo pipefail
          npm run version:check
          node --check addon.js
          node --check api/sktonline.js
          node --check api/sktorrent.js
          if grep -Rni -E 'SledujTo|SLEDUJTETO|sledujteto' addon.js api public package.json package-lock.json; then
            echo 'SledujTo reference still present in runtime files' >&2
            exit 1
          fi
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/one-time-remove-sledujto-v0114.yml scripts/remove-sledujto-v0114-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove SledujTo provider and bump v0.1.14'
          git push
