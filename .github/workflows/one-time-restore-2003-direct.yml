name: One-time restore 20:03 direct search

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-restore-2003-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore proven direct search behavior
        run: python3 scripts/restore_2003_direct.py
      - name: Syntax check
        run: |
          node --check api/sktonline.js
          node --check addon.js
      - name: Commit repair and cleanup
        shell: bash
        run: |
          rm -f scripts/restore_2003_direct.py .github/workflows/one-time-restore-2003-direct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sktonline.js scripts/restore_2003_direct.py .github/workflows/one-time-restore-2003-direct.yml
          git commit -m "Restore proven 20:03 direct search behavior"
          git push
