name: Probe SledujTo references

on:
  push:
    branches: [Master]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show SledujTo references
        run: |
          set +e
          grep -Rni -C 5 -E 'SledujTo|SLEDUJTETO|sledujteto' --exclude-dir=.git .
          exit 0
      - name: Cleanup
        run: |
          rm -f .github/workflows/one-time-probe-sledujto.yml scripts/probe-sledujto-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-time SledujTo probe'
            git push
          fi
