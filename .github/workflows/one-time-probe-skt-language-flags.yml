name: Probe SKTorrent language flags

on:
  push:
    branches: [Master]
    paths:
      - .github/workflows/one-time-probe-skt-language-flags.yml
      - scripts/probe-skt-language-flags-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch SKTorrent search
        run: |
          curl -4 -L --max-time 20 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/143 Safari/537.36' \
            -o /tmp/skt.html \
            -w 'status=%{http_code} bytes=%{size_download}\n' \
            'https://sktorrent.eu/torrent/torrents_v2.php?search=Masterplan&category=0&active=0&order=data&by=DESC&page=0'
      - name: Show matching card HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h = Path('/tmp/skt.html').read_text(errors='replace')
          print('HTML_BYTES', len(h))
          for needle in ['Masterplan', 'Mistrov', 'CZ/SK dabing', 'Filmy s titulkama']:
              p = h.lower().find(needle.lower())
              print('\nNEEDLE', needle, 'POS', p)
              if p >= 0:
                  print(h[max(0,p-1800):p+3000])
          print('\nIMG ATTRS NEAR LANGUAGE WORDS')
          for m in re.finditer(r'<img\b[^>]*>', h, re.I):
              s=m.group(0)
              if re.search(r'(cz|sk|en|eng|cze|slo|slk|flag|jazyk)', s, re.I):
                  print(s[:800])
          PY
      - name: Cleanup
        run: |
          rm -f .github/workflows/one-time-probe-skt-language-flags.yml scripts/probe-skt-language-flags-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-time SKTorrent language probe'
            git push
          fi
