name: One-time Direct full torrent traversal

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-direct-all-torrents.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Direct traversal
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, re
          path = Path('api/sktonline.js')
          text = path.read_text()
          new_search = base64.b64decode('').decode()
          new_find = base64.b64decode('').decode()
          text, n = re.subn(r'async function searchSktorrentDetails\(query, wantedTitles, trustedReference = false\) \{.*?\n\}\n\nasync function streamsForOnlinePage', new_search + '\nasync function streamsForOnlinePage', text, count=1, flags=re.S)
          if n != 1: raise SystemExit('searchSktorrentDetails replacement failed')
          text, n = re.subn(r'async function findFromSktorrentDetails\(queries, titles, imdbId, client = null\) \{.*?\n\}\n\nfunction directProviderWithin', new_find + '\nfunction directProviderWithin', text, count=1, flags=re.S)
          if n != 1: raise SystemExit('findFromSktorrentDetails replacement failed')
          text = text.replace("directProviderWithin(findFromSktorrentDetails(queries, titles, imdbId, sktClient), 20000, 'SKTorrent detail players')", "directProviderWithin(findFromSktorrentDetails(queries, titles, imdbId, sktClient), 45000, 'SKTorrent detail players')", 1)
          text = text.replace("  ]).slice(0, 24);\n}", "  ]).slice(0, 48);\n}", 1)
          text = text.replace("const qualities = ['1080p', '720p', '480p', '360p'];", "const qualities = ['1080p', '720p', '480p', '360p', '240p'];", 1)
          text = text.replace("const match = text.match(/\\b(2160|1440|1080|720|480|360)p?\\b/i);", "const match = text.match(/\\b(2160|1440|1080|720|480|360|240)p?\\b/i);", 1)
          path.write_text(text)
          PY

      - name: Syntax and regression checks
        shell: bash
        run: |
          node --check api/sktonline.js
          node --check api/sktorrent.js
          node --check addon.js
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('api/sktonline.js', 'utf8');
          if (!s.includes('skt-detail-search-all-v1')) throw new Error('all-results search missing');
          if (s.includes('rankedCandidates.slice(0, 10)')) throw new Error('old first-wave limit remains');
          if (!s.includes('DETAIL_CONCURRENCY = 6')) throw new Error('detail traversal batching missing');
          if (!s.includes("'240p'")) throw new Error('240p fallback missing');
          console.log('Direct full traversal regression checks OK');
          NODE

      - name: Commit patch and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/one-time-direct-all-torrents.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sktonline.js .github/workflows/one-time-direct-all-torrents.yml
          git commit -m "Inspect all SKTorrent matches for Direct players"
          git push
