name: SKTOnline WARP proxy v0.1.8

on:
  push:
    branches: [Master]
    paths:
      - scripts/patch-warp-proxy-v018.py
      - .github/workflows/one-time-warp-proxy-v018.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-warp-proxy-v018.py
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm run version:check
          node --check addon.js
          node --check api/sktonline.js
          node - <<'NODE'
          process.env.SKTONLINE_PROXY_URL = 'socks5h://127.0.0.1:40000';
          const api = require('./api/sktonline');
          if (typeof api.findOnlineSourceBundle !== 'function') throw new Error('findOnlineSourceBundle missing');
          console.log('SKTOnline proxy module load OK');
          NODE
      - name: Commit and cleanup
        run: |
          rm -f scripts/patch-warp-proxy-v018.py
          rm -f .github/workflows/one-time-warp-proxy-v018.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route SKTOnline metadata through local WARP proxy"
          git push
