name: Probe SKTOnline direct playback

on:
  push:
    branches:
      - Master
    paths:
      - 'scripts/probe-sktonline-direct.js'
      - '.github/workflows/probe-sktonline-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, dashboard]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Probe direct SKTOnline media
        run: node scripts/probe-sktonline-direct.js
