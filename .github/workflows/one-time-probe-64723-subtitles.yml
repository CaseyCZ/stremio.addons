name: Probe SKTOnline 64723 subtitle tracks

on:
  push:
    branches: [Master]
    paths:
      - scripts/probe-64723-trigger.txt
      - .github/workflows/one-time-probe-64723-subtitles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch video page
        run: |
          curl -4 -L --max-time 20 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/143 Safari/537.36' \
            -o /tmp/64723.html \
            -w 'status=%{http_code} bytes=%{size_download}\n' \
            'https://online.sktorrent.eu/video/64723/insidious-jsou-mezi-n%C3%A1mi-insidious-out-of-the-further-2026-3130392e38312e372e37362d'
      - name: Show subtitle structures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h = Path('/tmp/64723.html').read_text(errors='replace')
          print('HTML_BYTES', len(h))
          print('VTT_COUNT', len(re.findall(r'\.vtt\b', h, re.I)))
          pats = [r'<track\b[^>]*>', r'\btracks\s*:\s*\[[\s\S]{0,12000}?\]', r'[^\n]{0,180}\.vtt[^\n]{0,240}', r'\b(?:label|srclang|kind|file|src)\b[^\n]{0,300}']
          shown = 0
          for pat in pats:
              print('\nPATTERN', pat)
              for m in re.finditer(pat, h, re.I):
                  s = m.group(0).replace('\r',' ').replace('\n',' ')
                  print(s[:1600])
                  shown += 1
                  if shown >= 80:
                      break
              if shown >= 80:
                  break
          PY
      - name: Cleanup probe files
        run: |
          rm -f .github/workflows/one-time-probe-64723-subtitles.yml scripts/probe-64723-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-time SKTOnline subtitle probe'
            git push
          fi
