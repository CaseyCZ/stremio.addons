name: One-time enable SKTOnline detail CDN probing

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-enable-detail-cdn-probe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Resolve detail players directly through CDN edges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('api/sktonline.js')
          s = p.read_text()

          old = r'''function isSktOnlineUrl(url) {
  const host = hostOf(url);
  return host === 'online.sktorrent.eu' || /^online\d+\.sktorrent\.eu$/i.test(host);
}
'''
          new = old + r'''
const CDN_EDGES = Array.from({ length: 30 }, (_, index) => index + 1);
const CDN_QUALITIES = ['1080p', '720p', '480p', '360p', '240p'];
const cdnProbeInflight = new Map();

function onlineVideoIdFromUrl(value) {
  try {
    const path = new URL(String(value || '')).pathname;
    const match = path.match(/\/(?:embed|video)\/(\d+)(?:\/|$)/i);
    return match ? match[1] : null;
  } catch (_) {
    return null;
  }
}

async function probeCdnMedia(url) {
  try {
    const response = await axios.head(url, {
      timeout: 2500,
      maxRedirects: 2,
      validateStatus: status => status >= 200 && status < 500,
      headers: {
        'User-Agent': USER_AGENT,
        'Accept-Encoding': 'identity',
        Referer: `${SKTORRENT_BASE_URL}/`
      }
    });
    const type = String(response.headers['content-type'] || '');
    const length = Number(response.headers['content-length'] || 0);
    return (response.status === 200 || response.status === 206) && (/^video\//i.test(type) || length > 1024 * 1024);
  } catch (_) {
    return false;
  }
}

async function resolveOnlineVideoIdByProbe(videoId) {
  const id = String(videoId || '').trim();
  if (!/^\d+$/.test(id)) return [];
  const key = `cdn-probe:${id}`;
  const cached = cache.get(key);
  if (cached !== undefined) return cached;
  if (cdnProbeInflight.has(id)) return cdnProbeInflight.get(id);

  const task = (async () => {
    for (const quality of ['720p', '480p', '1080p', '360p', '240p']) {
      const probes = await Promise.all(CDN_EDGES.map(async edge => {
        const url = `https://online${edge}.sktorrent.eu/media/videos//h264/${id}_${quality}.mp4`;
        return await probeCdnMedia(url) ? edge : null;
      }));
      const edge = probes.find(Boolean);
      if (!edge) continue;

      const sources = (await Promise.all(CDN_QUALITIES.map(async foundQuality => {
        const url = `https://online${edge}.sktorrent.eu/media/videos//h264/${id}_${foundQuality}.mp4`;
        return await probeCdnMedia(url) ? { url, label: foundQuality } : null;
      }))).filter(Boolean);
      cache.set(key, sources, sources.length ? 6 * 60 * 60 : 5 * 60);
      return sources;
    }
    cache.set(key, [], 5 * 60);
    return [];
  })().finally(() => cdnProbeInflight.delete(id));

  cdnProbeInflight.set(id, task);
  return task;
}
'''
          if old not in s:
              raise SystemExit('isSktOnlineUrl block not found')
          s = s.replace(old, new, 1)

          old = r'''async function streamsForOnlinePage(pageUrl, referer, sourceTitle = '') {
  const key = `linked-online:${pageUrl}:${normalize(sourceTitle)}`;
  const cached = cache.get(key);
  if (cached !== undefined) return cached;

  if (resolverHttp && isSktOnlineUrl(pageUrl)) {'''
          new = r'''async function streamsForOnlinePage(pageUrl, referer, sourceTitle = '') {
  const key = `linked-online:${pageUrl}:${normalize(sourceTitle)}`;
  const cached = cache.get(key);
  if (cached !== undefined) return cached;

  const videoId = onlineVideoIdFromUrl(pageUrl);
  if (videoId && isSktOnlineUrl(pageUrl)) {
    const sources = await resolveOnlineVideoIdByProbe(videoId);
    if (sources.length) {
      const result = dedupeStreams(sources.map(item => makeStream(
        'SKTOnline',
        sourceTitle || 'SKTOnline',
        item.url,
        item.label,
        referer || pageUrl
      )));
      cache.set(key, result, 6 * 60 * 60);
      return result;
    }
  }

  if (resolverHttp && isSktOnlineUrl(pageUrl)) {'''
          if old not in s:
              raise SystemExit('streamsForOnlinePage insertion point not found')
          s = s.replace(old, new, 1)

          old = "      const card = link.closest('td, tr, article, div');\n"
          new = "      const card = link.closest('td').length ? link.closest('td') : link.closest('tr, article, div');\n"
          if old not in s:
              raise SystemExit('card selector not found')
          s = s.replace(old, new, 1)

          old = r'''      const category = String(card.find('b').first().text() || '').trim();
      if (!name || !candidateYearMatches(name, wantedTitles) || candidateHasConflictingYears(name, wantedTitles) || score < 0.7) return;'''
          new = r'''      const category = String(card.find('b').first().text() || '').trim();
      const playerMarkup = `${String(card.text() || '')} ${String(card.html() || '')}`;
      const hasPlayer = /play\s*video|play[_-]?video|online\.sktorrent\.eu\/embed|(?:^|[\/_-])play(?:[._-]|$)/i.test(playerMarkup);
      if (!name || !candidateYearMatches(name, wantedTitles) || candidateHasConflictingYears(name, wantedTitles) || score < 0.7) return;'''
          if old not in s:
              raise SystemExit('candidate metadata block not found')
          s = s.replace(old, new, 1)

          old = "      items.push({ id: idMatch[1], name, detailsUrl, score, category });\n"
          new = "      items.push({ id: idMatch[1], name, detailsUrl, score, category, hasPlayer });\n"
          if old not in s:
              raise SystemExit('candidate push not found')
          s = s.replace(old, new, 1)

          old = r'''    const result = items
      .sort((a, b) => (b.score - a.score) || (candidateLanguagePriority(a.name) - candidateLanguagePriority(b.name)))
      .slice(0, 8);'''
          new = r'''    const result = items
      .sort((a, b) => (Number(b.hasPlayer) - Number(a.hasPlayer)) || (b.score - a.score) || (candidateLanguagePriority(a.name) - candidateLanguagePriority(b.name)))
      .slice(0, 10);'''
          if old not in s:
              raise SystemExit('candidate sort not found')
          s = s.replace(old, new, 1)

          old = r'''  const rankedCandidates = [...candidates.values()].sort((a, b) => {
    const scoreDiff = (b.score || titleMatchScore(b.name, titles)) - (a.score || titleMatchScore(a.name, titles));
    if (scoreDiff) return scoreDiff;
    return candidateLanguagePriority(a.name) - candidateLanguagePriority(b.name);
  });'''
          new = r'''  const rankedCandidates = [...candidates.values()].sort((a, b) => {
    const playerDiff = Number(b.hasPlayer) - Number(a.hasPlayer);
    if (playerDiff) return playerDiff;
    const scoreDiff = (b.score || titleMatchScore(b.name, titles)) - (a.score || titleMatchScore(a.name, titles));
    if (scoreDiff) return scoreDiff;
    return candidateLanguagePriority(a.name) - candidateLanguagePriority(b.name);
  });'''
          if old not in s:
              raise SystemExit('rankedCandidates sort not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          p = Path('addon.js')
          s = p.read_text().replace('combined-v7:', 'combined-v8:', 1)
          p.write_text(s)
          PY

          node --check api/sktonline.js
          node --check api/sktorrent.js
          node --check addon.js
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/sktonline.js addon.js
          git diff --cached --quiet && exit 0
          git commit -m 'Resolve SKTOnline detail players through CDN edges'
          git push origin Master
