name: One-time CSFD search fallback

on:
  push:
    branches: [Master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add CSFD-aware search fallbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          csfd = r'''const axios = require('axios');
          const NodeCache = require('node-cache');

          const cache = new NodeCache({ stdTTL: 24 * 60 * 60, checkperiod: 60 * 60, maxKeys: 2000 });
          const WIKIDATA_SPARQL_URL = 'https://query.wikidata.org/sparql';
          const USER_AGENT = 'CaseyCZ-Stremio-SKTOnline/1.0';

          function normalizeImdbId(value) {
            const imdbId = String(value || '').trim().toLowerCase();
            return /^tt\d{5,10}$/.test(imdbId) ? imdbId : null;
          }

          async function getCsfdUrl(imdbId) {
            const normalized = normalizeImdbId(imdbId);
            if (!normalized) return null;
            const key = `csfd:${normalized}`;
            const cached = cache.get(key);
            if (cached !== undefined) return cached || null;

            const query = `SELECT ?csfdId WHERE {
              ?item wdt:P345 "${normalized}".
              ?item wdt:P2529 ?csfdId.
            } LIMIT 5`;

            try {
              const response = await axios.get(WIKIDATA_SPARQL_URL, {
                params: { query, format: 'json' },
                timeout: 3000,
                headers: {
                  Accept: 'application/sparql-results+json',
                  'User-Agent': USER_AGENT,
                  'Accept-Encoding': 'identity'
                }
              });
              const bindings = response.data?.results?.bindings || [];
              for (const row of bindings) {
                const id = String(row?.csfdId?.value || '').trim();
                if (!/^\d+$/.test(id)) continue;
                const url = `https://www.csfd.cz/film/${id}`;
                cache.set(key, url);
                return url;
              }
            } catch (error) {
              console.warn(`[csfd] Wikidata ${normalized}: ${error.message}`);
            }

            cache.set(key, false, 10 * 60);
            return null;
          }

          module.exports = { getCsfdUrl };
          '''
          Path('api/csfd.js').write_text(csfd)

          addon = Path('addon.js')
          text = addon.read_text()
          replacements = [
            ("const cacheKey = `combined-v10:${configFingerprint(cfg)}:${req.params.type}:${req.params.id}`;",
             "const cacheKey = `combined-v11:${configFingerprint(cfg)}:${req.params.type}:${req.params.id}`;"),
            ("? resolveWithin(findOnlineStreams({\n          titles,",
             "? resolveWithin(findOnlineStreams({\n          imdbId: parsed.imdbId,\n          titles,"),
            ("? resolveWithin(findTorrentStreams({\n          username: cfg.sktUsername,\n          password: cfg.sktPassword,\n          titles,",
             "? resolveWithin(findTorrentStreams({\n          username: cfg.sktUsername,\n          password: cfg.sktPassword,\n          imdbId: parsed.imdbId,\n          titles,")
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'addon replacement source not found: {old[:80]}')
            text = text.replace(old, new, 1)
          addon.write_text(text)

          skt = Path('api/sktorrent.js')
          text = skt.read_text()
          if "require('./csfd')" not in text:
            marker = "const crypto = require('crypto');\n"
            if marker not in text:
              raise SystemExit('sktorrent import marker not found')
            text = text.replace(marker, marker + "const { getCsfdUrl } = require('./csfd');\n", 1)

          old = "async function searchTorrents(query, wantedTitles, maxPages = 1) {"
          new = "async function searchTorrents(query, wantedTitles, maxPages = 1, trustedReference = false) {"
          if old not in text:
            raise SystemExit('searchTorrents signature not found')
          text = text.replace(old, new, 1)

          old = "const cacheKey = `${normalize(query)}:${maxPages}:${wantedKey}`;"
          new = "const cacheKey = `${normalize(query)}:${maxPages}:${trustedReference ? 'trusted' : 'normal'}:${wantedKey}`;"
          if old not in text:
            raise SystemExit('search cache key not found')
          text = text.replace(old, new, 1)

          old = "if (!name || !candidateYearMatches(name, wantedTitles) || candidateHasConflictingYears(name, wantedTitles) || score < 0.55) return;"
          new = "if (!name || candidateHasConflictingYears(name, wantedTitles)) return;\n        if (!trustedReference && (!candidateYearMatches(name, wantedTitles) || score < 0.55)) return;"
          if old not in text:
            raise SystemExit('torrent candidate filter not found')
          text = text.replace(old, new, 1)

          old = "async function findTorrentStreams({ username, password, titles, type, season, episode, limit = 8 }) {\n  const client = getClient(username, password);\n  const queries = queryVariants(titles, type, season, episode);\n  const found = new Map();"
          new = "async function findTorrentStreams({ username, password, imdbId, titles, type, season, episode, limit = 8 }) {\n  const client = getClient(username, password);\n  const queries = queryVariants(titles, type, season, episode);\n  const csfdUrl = await getCsfdUrl(imdbId);\n  const priorityQueries = csfdUrl ? [csfdUrl, ...queries] : queries;\n  const found = new Map();"
          if old not in text:
            raise SystemExit('findTorrentStreams header not found')
          text = text.replace(old, new, 1)

          old = "for (let offset = 0; offset < queries.length; offset += 4) {\n    const batch = queries.slice(offset, offset + 4);\n    const batches = await Promise.all(batch.map(query => searchTorrents(query, titles, 1)));"
          new = "for (let offset = 0; offset < priorityQueries.length; offset += 4) {\n    const batch = priorityQueries.slice(offset, offset + 4);\n    const batches = await Promise.all(batch.map(query => {\n      const trustedReference = Boolean(csfdUrl && query === csfdUrl);\n      return searchTorrents(query, titles, trustedReference ? 6 : 1, trustedReference);\n    }));"
          if old not in text:
            raise SystemExit('torrent query loop not found')
          text = text.replace(old, new, 1)
          skt.write_text(text)

          online = Path('api/sktonline.js')
          text = online.read_text()
          if "require('./csfd')" not in text:
            marker = "const NodeCache = require('node-cache');\n"
            if marker not in text:
              raise SystemExit('sktonline import marker not found')
            text = text.replace(marker, marker + "const { getCsfdUrl } = require('./csfd');\n", 1)

          old = "if (!candidateYears.length) return false;"
          if old not in text:
            raise SystemExit('direct candidateYearMatches source not found')
          text = text.replace(old, "if (!candidateYears.length) return true;", 1)

          old = "? dedupe([base, plain, stripYearTokens(base), stripYearTokens(plain), shortTitle(stripYearTokens(plain), 3), shortTitle(stripYearTokens(plain), 2)])"
          new = "? dedupe([stripYearTokens(base), stripYearTokens(plain), base, plain, shortTitle(stripYearTokens(plain), 3), shortTitle(stripYearTokens(plain), 2)])"
          if old not in text:
            raise SystemExit('direct movie query order source not found')
          text = text.replace(old, new, 1)

          old = "async function searchSktorrentDetails(query, wantedTitles) {"
          new = "async function searchSktorrentDetails(query, wantedTitles, trustedReference = false) {"
          if old not in text:
            raise SystemExit('searchSktorrentDetails signature not found')
          text = text.replace(old, new, 1)

          old = "if (!name || !candidateYearMatches(name, wantedTitles) || candidateHasConflictingYears(name, wantedTitles) || score < 0.7) return;"
          new = "if (!name || candidateHasConflictingYears(name, wantedTitles)) return;\n      if (!trustedReference && (!candidateYearMatches(name, wantedTitles) || score < 0.55)) return;"
          if old not in text:
            raise SystemExit('direct SKTorrent detail candidate filter not found')
          text = text.replace(old, new, 1)

          old = '''async function findFromSktorrentDetails(queries, titles) {
            const candidates = new Map();
            for (const query of queries.slice(0, 4)) {
              const found = await searchSktorrentDetails(query, titles);
              for (const item of found) if (!candidates.has(item.id)) candidates.set(item.id, item);
              if (candidates.size >= 10) break;
            }'''
          new = '''async function findFromSktorrentDetails(queries, titles, imdbId) {
            const candidates = new Map();
            const csfdUrl = await getCsfdUrl(imdbId);
            if (csfdUrl) {
              const exact = await searchSktorrentDetails(csfdUrl, titles, true);
              for (const item of exact) if (!candidates.has(item.id)) candidates.set(item.id, item);
            }
            for (const query of queries.slice(0, 6)) {
              const found = await searchSktorrentDetails(query, titles);
              for (const item of found) if (!candidates.has(item.id)) candidates.set(item.id, item);
              if (candidates.size >= 12) break;
            }'''
          if old not in text:
            raise SystemExit('findFromSktorrentDetails block not found')
          text = text.replace(old, new, 1)

          old = "async function findOnlineStreams({ titles, type, season, episode }) {"
          new = "async function findOnlineStreams({ imdbId, titles, type, season, episode }) {"
          if old not in text:
            raise SystemExit('findOnlineStreams signature not found')
          text = text.replace(old, new, 1)

          old = "directProviderWithin(findFromSktorrentDetails(queries, titles), 14000, 'SKTorrent detail players')"
          new = "directProviderWithin(findFromSktorrentDetails(queries, titles, imdbId), 16000, 'SKTorrent detail players')"
          if old not in text:
            raise SystemExit('findFromSktorrentDetails call not found')
          text = text.replace(old, new, 1)
          online.write_text(text)
          PY

      - name: Syntax check
        run: |
          node --check addon.js
          node --check api/csfd.js
          node --check api/sktorrent.js
          node --check api/sktonline.js

      - name: CSFD resolver smoke check
        continue-on-error: true
        run: |
          node - <<'NODE'
          const { getCsfdUrl } = require('./api/csfd');
          Promise.all([
            getCsfdUrl('tt1345836'),
            getCsfdUrl('tt0110912')
          ]).then(values => console.log('CSFD smoke:', values)).catch(error => console.warn(error.message));
          NODE

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-csfd-search-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js api/csfd.js api/sktorrent.js api/sktonline.js .github/workflows/one-time-csfd-search-fallback.yml
          git commit -m "Add CSFD-aware search fallbacks"
          git push
