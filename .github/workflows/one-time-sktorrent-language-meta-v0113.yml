name: SKTorrent language metadata v0.1.13

on:
  push:
    branches: [Master]
    paths:
      - scripts/patch-sktorrent-language-meta-v0113.py
      - .github/workflows/one-time-sktorrent-language-meta-v0113.yml
      - scripts/trigger-sktorrent-language-meta-v0113.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-sktorrent-language-meta-v0113.py
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm run version:check
          node --check addon.js
          node --check api/sktorrent.js
          node --check api/sktonline.js
      - name: Commit and cleanup
        run: |
          rm -f scripts/patch-sktorrent-language-meta-v0113.py
          rm -f scripts/trigger-sktorrent-language-meta-v0113.txt
          rm -f .github/workflows/one-time-sktorrent-language-meta-v0113.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use SKTorrent flags and category metadata for languages"
          git push
