name: One-time SKTOnline subtitles patch

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-add-sktonline-subtitles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add SKTOnline subtitle resource
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('addon.js')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              "const express = require('express');\n",
              "const express = require('express');\nconst axios = require('axios');\n",
              'axios import'
          )

          replace_once(
              "const streamCache = new NodeCache({ stdTTL: 5 * 60, checkperiod: 60, maxKeys: 2000 });\n",
              "const streamCache = new NodeCache({ stdTTL: 5 * 60, checkperiod: 60, maxKeys: 2000 });\nconst subtitleCache = new NodeCache({ stdTTL: 10 * 60, checkperiod: 60, maxKeys: 2000 });\nconst subtitleProbeCache = new NodeCache({ stdTTL: 60 * 60, checkperiod: 5 * 60, maxKeys: 4000 });\n",
              'subtitle caches'
          )

          replace_once(
              "    resources: ['stream'],\n",
              "    resources: ['stream', 'subtitles'],\n",
              'manifest resources'
          )

          helper = r'''
function extractSktOnlineVideoIds(streams) {
  const ids = [];
  const seen = new Set();
  for (const stream of Array.isArray(streams) ? streams : []) {
    if (!stream || !String(stream.name || '').startsWith('SKTOnline • ')) continue;
    try {
      const url = new URL(String(stream.url || ''));
      const host = url.hostname.toLowerCase();
      if (!(host === 'sktorrent.eu' || host.endsWith('.sktorrent.eu'))) continue;
      const match = decodeURIComponent(url.pathname || '').match(/\/h264\/(\d+)_((?:2160|1440|1080|720|480|360|240)p)\.mp4$/i);
      if (!match || seen.has(match[1])) continue;
      seen.add(match[1]);
      ids.push(match[1]);
    } catch (_) {}
  }
  return ids;
}

async function subtitleUrlExists(url) {
  const cached = subtitleProbeCache.get(url);
  if (cached !== undefined) return cached === true;

  try {
    const response = await axios.get(url, {
      timeout: 7000,
      responseType: 'text',
      transformResponse: [data => data],
      maxContentLength: 2 * 1024 * 1024,
      validateStatus: status => status >= 200 && status < 400,
      headers: {
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/143 Safari/537.36',
        Accept: 'text/vtt,text/plain,*/*',
        Referer: 'https://online.sktorrent.eu/'
      }
    });
    const body = String(response.data || '').replace(/^\uFEFF/, '').trimStart();
    const contentType = String(response.headers && response.headers['content-type'] || '');
    const ok = /^WEBVTT(?:\s|$)/i.test(body) || /text\/vtt/i.test(contentType);
    subtitleProbeCache.set(url, ok, ok ? 60 * 60 : 5 * 60);
    return ok;
  } catch (_) {
    subtitleProbeCache.set(url, false, 5 * 60);
    return false;
  }
}

async function resolveSktOnlineSubtitles(cfg, type, id, parsed) {
  const lookupKey = `sub-v1:${configFingerprint(cfg)}:${type}:${id}`;
  const cached = subtitleCache.get(lookupKey);
  if (cached !== undefined) return cached;
  if (!cfg.enableOnline) return [];

  const combinedKey = `combined-v13:${configFingerprint(cfg)}:${type}:${id}`;
  let directStreams = streamCache.get(combinedKey);

  if (!Array.isArray(directStreams)) {
    const meta = await cinemeta.getMeta(type, parsed.imdbId);
    const titles = titleCandidates(meta, type);
    if (!titles.length) {
      subtitleCache.set(lookupKey, [], 2 * 60);
      return [];
    }

    directStreams = await resolveWithin(findOnlineStreams({
      imdbId: parsed.imdbId,
      titles,
      type,
      season: parsed.season,
      episode: parsed.episode,
      sktUsername: cfg.enableTorrents ? cfg.sktUsername : '',
      sktPassword: cfg.enableTorrents ? cfg.sktPassword : ''
    }), 22000, 'subtitle-direct-detail');
  }

  const videoIds = extractSktOnlineVideoIds(directStreams).slice(0, 8);
  const candidates = [];
  for (const videoId of videoIds) {
    candidates.push(
      { id: `sktonline-${videoId}-cze`, videoId, lang: 'cze', url: `https://online.sktorrent.eu/media/videos/vtt/${videoId}/cze.vtt` },
      { id: `sktonline-${videoId}-slo`, videoId, lang: 'slk', url: `https://online.sktorrent.eu/media/videos/vtt/${videoId}/slo.vtt` }
    );
  }

  const checked = await Promise.all(candidates.map(async item =>
    await subtitleUrlExists(item.url) ? item : null
  ));

  const subtitles = checked.filter(Boolean).map(({ id: subtitleId, url, lang }) => ({
    id: subtitleId,
    url,
    lang
  }));

  subtitleCache.set(lookupKey, subtitles, subtitles.length ? 10 * 60 : 2 * 60);
  console.log(`[subtitle] ${type}/${id}: videoIds=${videoIds.join(',') || '-'} tracks=${subtitles.length}`);
  return subtitles;
}

async function handleSubtitles(req, res) {
  noCache(res);
  const cfg = normalizeConfig(decryptConfig(req.params.cfg));
  if (!cfg) return res.status(400).json({ error: 'Invalid configuration' });
  if (!['movie', 'series'].includes(req.params.type)) return res.json({ subtitles: [] });

  const id = String(req.params.id || '').replace(/\.json$/, '');
  const parsed = parseStremioId(id);
  if (!parsed) return res.json({ subtitles: [] });

  try {
    const subtitles = await resolveSktOnlineSubtitles(cfg, req.params.type, id, parsed);
    return res.json({ subtitles });
  } catch (error) {
    console.error(`[subtitle] ${req.params.type}/${id}: ${error.message}`);
    return res.json({ subtitles: [] });
  }
}

'''
          replace_once(
              "app.post('/api/config-token', async (req, res) => {\n",
              helper + "app.post('/api/config-token', async (req, res) => {\n",
              'subtitle helpers'
          )

          routes = "app.get('/:cfg/subtitles/:type/:id.json', handleSubtitles);\napp.get('/:cfg/subtitles/:type/:id/:extra.json', handleSubtitles);\n\n"
          replace_once(
              "app.get('/version', (req, res) => {\n",
              routes + "app.get('/version', (req, res) => {\n",
              'subtitle routes'
          )

          replace_once(
              "    streamCacheKeys: streamCache.keys().length\n",
              "    streamCacheKeys: streamCache.keys().length,\n    subtitleCacheKeys: subtitleCache.keys().length,\n    subtitleProbeCacheKeys: subtitleProbeCache.keys().length\n",
              'health subtitle caches'
          )

          p.write_text(s)

          readme = Path('README.md')
          r = readme.read_text()
          if '- `/:cfg/subtitles/:type/:id.json`' not in r:
              r = r.replace(
                  '- `/:cfg/stream/:type/:id.json`\n',
                  '- `/:cfg/stream/:type/:id.json`\n- `/:cfg/subtitles/:type/:id.json`\n'
              )
          if 'SKTOnline VTT titulky' not in r:
              r = r.replace(
                  '- SKTOnline přímé MP4 streamy\n',
                  '- SKTOnline přímé MP4 streamy\n- SKTOnline VTT titulky (CZ/SK) přes Stremio `subtitles` resource\n'
              )
          readme.write_text(r)
          PY
          node --check addon.js
          npm run version:check
      - name: Commit and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/one-time-add-sktonline-subtitles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js README.md .github/workflows/one-time-add-sktonline-subtitles.yml
          git commit -m "Add SKTOnline subtitle resource"
          git push
