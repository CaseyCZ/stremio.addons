name: One-time refine Matrix SKTOnline languages

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-fix-matrix-matching.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Patch per-embed Matrix languages
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
          node --check api/sktonline.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/sktonline.js
          git commit -m 'Map SKTOnline embeds to page language order'
          git push origin Master
