name: One-time restore independent SKTorrent source pipelines

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-fix-matrix-matching.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Keep torrent, direct-online and detail-player discovery separate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('api/sktonline.js')
          s = p.read_text()

          # Remove the temporary external metadata-catalog path. It collapsed
          # multiple SKTorrent language players into one unrelated video id.
          s = re.sub(r"^const METADATA_BASE_URL = .*\n", "", s, flags=re.M)
          s = re.sub(r"^const metadataHttp = .*\n", "", s, flags=re.M)
          s = re.sub(
              r"\nconst CDN_EDGES = Array\.from\(\{ length: 30 \}, \(_, index\) => index \+ 1\);.*?(?=\nasync function streamsFromSktorrentDetail\(candidate\) \{)",
              "\n",
              s,
              flags=re.S,
          )

          old_host = """function isSktOnlineUrl(url) {
            return hostOf(url) === 'online.sktorrent.eu';
          }"""
          new_host = """function isSktOnlineUrl(url) {
            const host = hostOf(url);
            return host === 'online.sktorrent.eu' || /^online\\d+\\.sktorrent\\.eu$/i.test(host);
          }"""
          if old_host in s:
              s = s.replace(old_host, new_host, 1)

          helpers = r'''
async function searchDirectOnlineVideos(query, wantedTitles) {
  const key = `online-title-search:${normalize(query)}`;
  const cached = cache.get(key);
  if (cached !== undefined) return cached;

  try {
    const response = await onlineHttp.get('/search/videos', {
      params: { search_query: query },
      headers: { Referer: `${ONLINE_BASE_URL}/` }
    });
    const $ = cheerio.load(response.data);
    const wantedNames = dedupe((wantedTitles || []).map(stripYearTokens).filter(Boolean));
    const items = [];
    const seen = new Set();

    $("a[href^='/video/'], a[href*='online.sktorrent.eu/video/']").each((_, el) => {
      const link = $(el);
      const href = String(link.attr('href') || '');
      const match = href.match(/\/video\/(\d+)/i);
      if (!match || seen.has(match[1])) return;

      const context = String(
        link.attr('title') ||
        link.find('img').attr('alt') ||
        link.text() ||
        link.closest('article,li,div,tr,td').text() || ''
      ).replace(/\s+/g, ' ').trim();

      if (context) {
        if (candidateHasConflictingYears(context, wantedTitles)) return;
        if (titleMatchScore(context, wantedNames) < 0.55) return;
      }

      seen.add(match[1]);
      items.push({ id: match[1], title: context });
    });

    cache.set(key, items, items.length ? 5 * 60 : 60);
    return items;
  } catch (error) {
    console.warn(`[direct-online] search "${query}": ${error.message}`);
    return [];
  }
}

async function streamsForDirectOnlineVideo(item) {
  const pageUrl = `${ONLINE_BASE_URL}/video/${encodeURIComponent(item.id)}`;
  return streamsForOnlinePage(pageUrl, `${ONLINE_BASE_URL}/`, item.title || '');
}

async function findDirectOnlineByTitle(queries, titles) {
  const found = new Map();
  for (const query of queries.slice(0, 6)) {
    const items = await searchDirectOnlineVideos(query, titles);
    for (const item of items) if (!found.has(item.id)) found.set(item.id, item);
    if (found.size >= 8) break;
  }
  if (!found.size) return [];
  const batches = await Promise.all([...found.values()].slice(0, 8).map(streamsForDirectOnlineVideo));
  return dedupeStreams(batches.flat()).slice(0, 12);
}
'''

          anchor = 'async function streamsFromSktorrentDetail(candidate) {'
          if 'async function findDirectOnlineByTitle(' not in s:
              if anchor not in s:
                  raise SystemExit('streamsFromSktorrentDetail anchor not found')
              s = s.replace(anchor, helpers + '\n' + anchor, 1)

          s = s.replace('if (candidates.size >= 6) break;', 'if (candidates.size >= 8) break;')
          s = s.replace('rankedCandidates.slice(0, 6).map(streamsFromSktorrentDetail)', 'rankedCandidates.slice(0, 8).map(streamsFromSktorrentDetail)')

          old = re.compile(
              r"async function findOnlineStreams\(\{ titles, type, season, episode \}\) \{.*?\n\}\n\nmodule\.exports = \{ findOnlineStreams \};",
              re.S,
          )
          new = '''async function findOnlineStreams({ titles, type, season, episode }) {
            const queries = buildQueries(titles, type, season, episode);

            // Two independent direct-video paths, both driven only by the
            // Stremio movie/episode title:
            // 1) online.sktorrent.eu title search -> /video/<id> -> direct MP4
            // 2) SKTorrent title search -> every matching torrent detail page ->
            //    every embedded language player on that page -> direct MP4
            // SledujTo remains an independent direct provider and never replaces
            // either SKTorrent path.
            const [fromDirectOnline, fromTorrentDetails, sledujToByTitle] = await Promise.all([
              findDirectOnlineByTitle(queries, titles),
              findFromSktorrentDetails(queries, titles),
              findSledujtetoByTitle(queries, titles)
            ]);

            return dedupeStreams([
              ...fromDirectOnline,
              ...fromTorrentDetails,
              ...sledujToByTitle
            ]).slice(0, 24);
          }

          module.exports = {
            findOnlineStreams,
            findDirectOnlineByTitle,
            findFromSktorrentDetails
          };'''
          s, count = old.subn(new, s, count=1)
          if count != 1:
              raise SystemExit('findOnlineStreams block not replaced')

          p.write_text(s)

          addon = Path('addon.js')
          a = addon.read_text()
          a = a.replace('combined-v4:', 'combined-v5:')
          addon.write_text(a)
          PY

          node --check api/sktonline.js
          node --check api/sktorrent.js
          node --check addon.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/sktonline.js addon.js
          git diff --cached --quiet && exit 0
          git commit -m 'Keep torrent direct and detail-player discovery separate'
          git push origin Master
