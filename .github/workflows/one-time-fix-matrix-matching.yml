name: One-time patch stream dedupe identities

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-fix-matrix-matching.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Dedupe players by source identity and torrents by infohash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('api/sktonline.js')
          s = p.read_text()
          old = r'''function streamVariantKey(stream) {
  const name = String(stream && stream.name || '').replace(/\s+/g, ' ').trim().toLowerCase();
  const title = String(stream && stream.title || '').replace(/\s+/g, ' ').trim().toLowerCase();
  return `${name}|${title}`;
}

function dedupeStreams(streams) {
  const seenUrls = new Set();
  const seenVariants = new Set();
  return streams.filter(stream => {
    if (!stream || !stream.url || seenUrls.has(stream.url)) return false;
    const variant = streamVariantKey(stream);
    if (variant && seenVariants.has(variant)) return false;
    seenUrls.add(stream.url);
    if (variant) seenVariants.add(variant);
    return true;
  });
}'''
          new = r'''function canonicalDirectIdentity(stream) {
  const raw = String(stream && stream.url || '').trim();
  if (!raw) return '';
  try {
    const parsed = new URL(raw);
    const path = decodeURIComponent(parsed.pathname || '');
    const skt = path.match(/\/h264\/(\d+)_((?:2160|1440|1080|720|480|360|240)p)\.mp4$/i);
    if (skt) return `sktvideo:${skt[1]}:${skt[2].toLowerCase()}`;
    return `url:${parsed.protocol.toLowerCase()}//${parsed.hostname.toLowerCase()}${parsed.pathname}${parsed.search}`;
  } catch (_) {
    return `url:${raw}`;
  }
}

function dedupeStreams(streams) {
  const seen = new Set();
  return (streams || []).filter(stream => {
    if (!stream || !stream.url) return false;
    const identity = canonicalDirectIdentity(stream);
    if (!identity || seen.has(identity)) return false;
    seen.add(identity);
    return true;
  });
}'''
          if old not in s:
              raise SystemExit('dedupeStreams block not found')
          s = s.replace(old, new, 1)
          s = s.replace('if (candidates.size >= 8) break;', 'if (candidates.size >= 10) break;', 1)
          s = s.replace('rankedCandidates.slice(0, 8).map(streamsFromSktorrentDetail)', 'rankedCandidates.slice(0, 10).map(streamsFromSktorrentDetail)', 1)
          p.write_text(s)

          p = Path('addon.js')
          s = p.read_text()
          old = r'''function dedupeCombinedStreams(streams) {
  const seen = new Set();
  return (streams || []).filter(stream => {
    if (!stream) return false;
    const key = stream.url
      ? `url:${stream.url}`
      : stream.infoHash
        ? `torrent:${String(stream.infoHash).toLowerCase()}:${Number(stream.fileIdx || 0)}`
        : `other:${stream.name || ''}:${stream.title || ''}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}'''
          new = r'''function combinedStreamIdentity(stream) {
  if (!stream) return '';
  if (stream.infoHash) {
    return `torrent:${String(stream.infoHash).toLowerCase()}:${Number(stream.fileIdx || 0)}`;
  }
  if (stream.url) {
    const raw = String(stream.url).trim();
    try {
      const parsed = new URL(raw);
      const path = decodeURIComponent(parsed.pathname || '');
      const skt = path.match(/\/h264\/(\d+)_((?:2160|1440|1080|720|480|360|240)p)\.mp4$/i);
      if (skt) return `sktvideo:${skt[1]}:${skt[2].toLowerCase()}`;
      return `url:${parsed.protocol.toLowerCase()}//${parsed.hostname.toLowerCase()}${parsed.pathname}${parsed.search}`;
    } catch (_) {
      return `url:${raw}`;
    }
  }
  return `other:${stream.name || ''}:${stream.title || ''}`;
}

function dedupeCombinedStreams(streams) {
  const seen = new Set();
  return (streams || []).filter(stream => {
    const key = combinedStreamIdentity(stream);
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}'''
          if old not in s:
              raise SystemExit('dedupeCombinedStreams block not found')
          s = s.replace(old, new, 1)
          s = s.replace('combined-v5:', 'combined-v6:', 1)
          s = s.replace('          limit: 8\n', '          limit: 10\n', 1)
          p.write_text(s)
          PY

          node --check api/sktonline.js
          node --check api/sktorrent.js
          node --check addon.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/sktonline.js addon.js
          git diff --cached --quiet && exit 0
          git commit -m 'Dedupe direct players by source identity'
          git push origin Master
