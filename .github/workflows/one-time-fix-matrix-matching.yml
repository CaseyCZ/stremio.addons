name: One-time patch stream dedupe identities

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-fix-matrix-matching.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
      - name: Dedupe source identities
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
          node --check api/sktonline.js
          node --check api/sktorrent.js
          node --check addon.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/sktonline.js addon.js
          git diff --cached --quiet && exit 0
          git commit -m 'Dedupe direct players by source identity'
          git push origin Master
