name: One-time fix Matrix matching

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-fix-matrix-matching.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Patch direct and torrent matching
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
          node --check api/sktonline.js
          node --check api/sktorrent.js
          node --check addon.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/sktonline.js api/sktorrent.js addon.js
          git commit -m 'Fix exact movie matching and Matrix online variants'
          git push origin Master
