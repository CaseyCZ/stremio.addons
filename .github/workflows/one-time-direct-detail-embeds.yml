name: One-time authenticated direct embed repair

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-direct-detail-embeds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_direct_detail_embeds.py
      - name: Syntax check
        run: |
          node --check api/sktonline.js
          node --check addon.js
      - name: Commit repair and cleanup
        shell: bash
        run: |
          rm -f scripts/patch_direct_detail_embeds.py .github/workflows/one-time-direct-detail-embeds.yml .github/workflows/direct-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sktonline.js scripts/patch_direct_detail_embeds.py .github/workflows/one-time-direct-detail-embeds.yml .github/workflows/direct-diagnostic.yml
          git commit -m "Resolve direct streams from authenticated SKTorrent embeds"
          git push
