name: One-time search latency optimization

on:
  push:
    branches: [Master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Optimize CSFD and fallback search latency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          addon = Path('addon.js')
          text = addon.read_text()
          if 'combined-v12:' not in text:
            raise SystemExit('combined-v12 cache key not found')
          addon.write_text(text.replace('combined-v12:', 'combined-v13:', 1))

          skt = Path('api/sktorrent.js')
          text = skt.read_text()
          old = '''  const queries = queryVariants(titles, type, season, episode);
            const csfdUrl = await getCsfdUrl(imdbId);
            const priorityQueries = csfdUrl ? [csfdUrl, ...queries] : queries;
            const found = new Map();
          
            // Search several title variants in parallel, but keep the batch small so
            // we improve coverage without hammering SKTorrent.
            for (let offset = 0; offset < priorityQueries.length; offset += 4) {
              const batch = priorityQueries.slice(offset, offset + 4);
              const batches = await Promise.all(batch.map(query => {
                const trustedReference = Boolean(csfdUrl && query === csfdUrl);
                return searchTorrents(query, titles, trustedReference ? 6 : 1, trustedReference);
              }));
              for (const results of batches) {
                for (const item of results) if (!found.has(item.id)) found.set(item.id, item);
              }
              if (found.size >= limit * 2) break;
            }'''
          # account for normal indentation in source
          old2 = '''  const queries = queryVariants(titles, type, season, episode);
  const csfdUrl = await getCsfdUrl(imdbId);
  const priorityQueries = csfdUrl ? [csfdUrl, ...queries] : queries;
  const found = new Map();

  // Search several title variants in parallel, but keep the batch small so
  // we improve coverage without hammering SKTorrent.
  for (let offset = 0; offset < priorityQueries.length; offset += 4) {
    const batch = priorityQueries.slice(offset, offset + 4);
    const batches = await Promise.all(batch.map(query => {
      const trustedReference = Boolean(csfdUrl && query === csfdUrl);
      return searchTorrents(query, titles, trustedReference ? 6 : 1, trustedReference);
    }));
    for (const results of batches) {
      for (const item of results) if (!found.has(item.id)) found.set(item.id, item);
    }
    if (found.size >= limit * 2) break;
  }'''
          new = '''  const queries = queryVariants(titles, type, season, episode);
  const csfdUrl = await getCsfdUrl(imdbId);
  const found = new Map();

  // Exact CSFD reference is the highest-confidence path. One page is normally
  // enough and avoids spending most of the Stremio timeout walking pagination.
  if (csfdUrl) {
    const exact = await searchTorrents(csfdUrl, titles, 1, true);
    for (const item of exact) if (!found.has(item.id)) found.set(item.id, item);
  }

  // Fill any remaining slots from broader text variants in small parallel batches.
  for (let offset = 0; offset < queries.length && found.size < limit * 2; offset += 4) {
    const batch = queries.slice(offset, offset + 4);
    const batches = await Promise.all(batch.map(query => searchTorrents(query, titles, 1, false)));
    for (const results of batches) {
      for (const item of results) if (!found.has(item.id)) found.set(item.id, item);
    }
  }'''
          source = old2 if old2 in text else old
          if source not in text:
            raise SystemExit('P2P CSFD search loop source not found')
          skt.write_text(text.replace(source, new, 1))

          online = Path('api/sktonline.js')
          text = online.read_text()
          old = '''  if (csfdUrl) {
              const exact = await searchSktorrentDetails(csfdUrl, titles, true);
              for (const item of exact) if (!candidates.has(item.id)) candidates.set(item.id, item);
            }
            for (const query of queries.slice(0, 6)) {
              const found = await searchSktorrentDetails(query, titles);
              for (const item of found) if (!candidates.has(item.id)) candidates.set(item.id, item);
              if (candidates.size >= 12) break;
            }'''
          old2 = '''  if (csfdUrl) {
    const exact = await searchSktorrentDetails(csfdUrl, titles, true);
    for (const item of exact) if (!candidates.has(item.id)) candidates.set(item.id, item);
  }
  for (const query of queries.slice(0, 6)) {
    const found = await searchSktorrentDetails(query, titles);
    for (const item of found) if (!candidates.has(item.id)) candidates.set(item.id, item);
    if (candidates.size >= 12) break;
  }'''
          new = '''  if (csfdUrl) {
    const exact = await searchSktorrentDetails(csfdUrl, titles, true);
    for (const item of exact) if (!candidates.has(item.id)) candidates.set(item.id, item);
  }

  const fallbacks = queries.slice(0, 6);
  for (let offset = 0; offset < fallbacks.length && candidates.size < 10; offset += 3) {
    const batch = fallbacks.slice(offset, offset + 3);
    const groups = await Promise.all(batch.map(query => searchSktorrentDetails(query, titles)));
    for (const found of groups) {
      for (const item of found) if (!candidates.has(item.id)) candidates.set(item.id, item);
    }
  }'''
          source = old2 if old2 in text else old
          if source not in text:
            raise SystemExit('direct detail fallback loop source not found')
          online.write_text(text.replace(source, new, 1))

          deploy = Path('deploy-server.sh')
          text = deploy.read_text()
          marker = 'node --check api/cinemeta.js\n'
          if 'node --check api/csfd.js' not in text:
            if marker not in text:
              raise SystemExit('deploy syntax marker not found')
            text = text.replace(marker, marker + 'node --check api/csfd.js\n', 1)
          deploy.write_text(text)
          PY

      - name: Syntax check
        run: |
          node --check addon.js
          node --check api/csfd.js
          node --check api/sktorrent.js
          node --check api/sktonline.js
          bash -n deploy-server.sh

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-search-latency-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js api/sktorrent.js api/sktonline.js deploy-server.sh .github/workflows/one-time-search-latency-fix.yml
          git commit -m "Optimize SKTorrent search latency"
          git push
