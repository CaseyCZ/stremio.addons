name: One-time SKTOnline embed suffix direct repair

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-embed-suffix-direct-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_embed_suffix_direct.py
      - name: Syntax check
        run: |
          node --check api/sktonline.js
          node --check addon.js
      - name: Commit repair and cleanup
        shell: bash
        run: |
          rm -f scripts/patch_embed_suffix_direct.py .github/workflows/one-time-embed-suffix-direct-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sktonline.js scripts/patch_embed_suffix_direct.py .github/workflows/one-time-embed-suffix-direct-fix.yml
          git commit -m "Handle SKTOnline embed suffixes and player ids"
          git push
