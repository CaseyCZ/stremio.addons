name: Temporary mobile and desktop web design verification

on:
  push:
    branches: [feature/web-redesign]
    paths: [.github/workflows/verify-configure-design-temporary.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser and local addon
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core
          CONFIG_ENCRYPTION_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa PORT=17233 node addon.js >/tmp/web-redesign-app.log 2>&1 &
          echo $! >/tmp/web-redesign-app.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17233/health >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/web-redesign-app.log
          exit 1
      - name: Test 390px mobile and desktop interactions
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          const path=require('path');
          const browserPath=[
            '/usr/bin/google-chrome','/usr/bin/google-chrome-stable',
            '/usr/bin/chromium','/usr/bin/chromium-browser'
          ].find(p=>fs.existsSync(p));
          if(!browserPath)throw Error('No Chrome executable');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:browserPath,args:['--no-sandbox']});
            for(const size of [[390,844],[1280,900]]){
              const page=await browser.newPage({viewport:{width:size[0],height:size[1]},deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:17233/configure',{waitUntil:'networkidle'});
              const width=await page.evaluate(()=>document.documentElement.scrollWidth);
              if(width>size[0])throw Error('Horizontal overflow '+width+' at '+size[0]);
              if(await page.locator('.addon').count()!==3)throw Error('Expected 3 cards');
              if(!(await page.locator('#torrentGenerate').isDisabled()))throw Error('Torrent button enabled without credentials');
              if(await page.locator('#sktorrent .output').isVisible())throw Error('Torrent link appeared without account');
              await page.screenshot({path:'design-'+size[0]+'.png',fullPage:true});
              await page.locator('#sktonline .generate').click();
              await page.locator('#sktonline .output').waitFor({state:'visible'});
              const directLink=await page.locator('#sktonlineUrl').inputValue();
              if(!directLink.includes('/manifest.json')||!directLink.includes('enc1.'))throw Error('Direct install not generated');
              await page.locator('#sosacSettings summary').click();
              await page.locator('#sosacUsername').fill('testonly');
              if(!(await page.locator('#bombujNative').isVisible()))throw Error('Unpaired Sosac login hid public Bombuj');
              await page.locator('#sosacPassword').fill('testonly');
              if(await page.locator('#bombujNative').isVisible())throw Error('Public Bombuj remains after opt-in');
              if(!(await page.locator('#bombujLinked').isVisible()))throw Error('Configured Bombuj missing');
              if(await page.locator('#sktonline .output').isVisible())throw Error('Old Direct manifest remained after credentials changed');
              await page.locator('#bombuj .generate').click();
              await page.locator('#bombuj .bridge-output').waitFor({state:'visible'});
              const linked=await page.locator('#bombujBridgeUrl').inputValue();
              if(!linked.includes('/bombuj/manifest.json'))throw Error('Bombuj bridge link missing');
              await page.locator('#sktUsername').fill('someone');
              await page.locator('#sktPassword').fill('somesecret');
              if(await page.locator('#torrentGenerate').isDisabled())throw Error('Torrent action stays disabled with credentials');
              if(await page.locator('#sktorrent .output').isVisible())throw Error('Torrent manifest shown before login verification');
              await page.locator('#uiLanguage').selectOption('sk');
              if(await page.locator('#bombuj .bridge-output').isVisible())throw Error('Stale Bombuj manifest stayed visible after locale change');
              if(errors.length)throw Error('Browser JavaScript errors: '+errors.join(','));
              console.log('WEB_UI_'+size[0]+'_OK, scrollWidth='+width);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stremio-config-design-screenshots
          path: design-*.png
          retention-days: 3
