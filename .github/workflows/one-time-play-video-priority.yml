name: One-time Play Video priority patch

on:
  push:
    branches:
      - Master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/one-time-play-video-patch.py

      - name: Syntax check
        run: |
          node --check api/sktonline.js
          node --check addon.js

      - name: Commit result
        run: |
          rm -f scripts/one-time-play-video-patch.py
          rm -f .github/workflows/one-time-play-video-priority.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prioritize Play Video torrent details for direct streams'
          git push origin Master
