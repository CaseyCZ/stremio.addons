name: Tighten SKTorrent result matching

on:
  push:
    branches:
      - Master
    paths:
      - '.github/workflows/one-time-cz-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match exact movie/year and keep all release variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('api/sktonline.js')
          text = path.read_text()

          slug_line = "function slugify(value) { return normalize(value).replace(/\\s+/g, '-'); }"
          helper = r"""function yearsInText(value) {
            return dedupe((String(value || '').match(/\b(?:19|20)\d{2}\b/g) || []));
          }

          function candidateYearMatches(candidate, wantedTitles) {
            const wantedYears = dedupe((wantedTitles || []).flatMap(yearsInText));
            if (!wantedYears.length) return true;
            const candidateYears = yearsInText(candidate);
            if (!candidateYears.length) return false;
            return candidateYears.some(year => wantedYears.includes(year));
          }"""
          if 'function yearsInText(value)' not in text:
            if slug_line not in text:
              raise SystemExit('slug anchor missing')
            text = text.replace(slug_line, slug_line + '\n\n' + helper, 1)

          variants_old = "    const variants = dedupe([base, stripDiacritics(base), shortTitle(stripDiacritics(base), 3)]);"
          variants_new = """    const plain = stripDiacritics(base);
            const variants = type === 'movie'
              ? dedupe([base, plain])
              : dedupe([base, plain, shortTitle(plain, 3)]);"""
          if variants_old not in text:
            raise SystemExit('variants line missing')
          text = text.replace(variants_old, variants_new, 1)

          filter_old = "      if (!name || titleMatchScore(name, wantedTitles) < 0.45) return;"
          filter_new = """      const score = titleMatchScore(name, wantedTitles);
                if (!name || !candidateYearMatches(name, wantedTitles) || score < 0.7) return;"""
          if filter_old not in text:
            raise SystemExit('search filter line missing')
          text = text.replace(filter_old, filter_new, 1)

          ranking_pattern = re.compile(
            r"  const rankedCandidates = \[\.\.\.candidates\.values\(\)\]\.sort\(\(a, b\) =>\s*"
            r"candidateLanguagePriority\(a\.name\) - candidateLanguagePriority\(b\.name\)\s*"
            r"\);\s*"
            r"const batches = await Promise\.all\(rankedCandidates\.slice\(0, 6\)\.map\(streamsFromSktorrentDetail\)\);"
          )
          ranking_new = """  const rankedCandidates = [...candidates.values()].sort((a, b) => {
            const languageDiff = candidateLanguagePriority(a.name) - candidateLanguagePriority(b.name);
            if (languageDiff) return languageDiff;
            return titleMatchScore(b.name, titles) - titleMatchScore(a.name, titles);
          });
          const batches = await Promise.all(rankedCandidates.slice(0, 6).map(streamsFromSktorrentDetail));"""
          text, count = ranking_pattern.subn(ranking_new, text, count=1)
          if count != 1:
            raise SystemExit('ranking block missing')

          path.write_text(text)

          addon = Path('addon.js')
          addon_text = addon.read_text()
          if 'direct-detail-v6:' not in addon_text:
            raise SystemExit('addon cache key anchor missing')
          addon.write_text(addon_text.replace('direct-detail-v6:', 'direct-detail-v7:', 1))
          PY

          node --check api/sktonline.js
          node --check addon.js
          git diff --check
          git config user.name 'CaseyCZ automation'
          git config user.email 'actions@users.noreply.github.com'
          git add api/sktonline.js addon.js
          git commit -m 'Match SKTorrent releases by exact movie year'
          git push origin HEAD:Master
