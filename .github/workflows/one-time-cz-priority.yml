name: Tighten SKTorrent result matching

on:
  push:
    branches:
      - Master
    paths:
      - '.github/workflows/one-time-cz-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match exact movie/year and keep all release variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/sktonline.js')
          text = path.read_text()

          old = """function slugify(value) { return normalize(value).replace(/\\s+/g, '-'); }

          function titleMatchScore(candidate, wantedTitles) {"""
          new = r"""function slugify(value) { return normalize(value).replace(/\s+/g, '-'); }

          function yearsInText(value) {
            return dedupe((String(value || '').match(/\b(?:19|20)\d{2}\b/g) || []));
          }

          function candidateYearMatches(candidate, wantedTitles) {
            const wantedYears = dedupe((wantedTitles || []).flatMap(yearsInText));
            if (!wantedYears.length) return true;
            const candidateYears = yearsInText(candidate);
            if (!candidateYears.length) return false;
            return candidateYears.some(year => wantedYears.includes(year));
          }

          function titleMatchScore(candidate, wantedTitles) {"""
          if old not in text:
            raise SystemExit('slug/title anchor missing')
          text = text.replace(old, new, 1)

          old = """    const variants = dedupe([base, stripDiacritics(base), shortTitle(stripDiacritics(base), 3)]);
            if (type === 'series' && Number.isInteger(season) && Number.isInteger(episode)) {"""
          new = """    const plain = stripDiacritics(base);
            const variants = type === 'movie'
              ? dedupe([base, plain])
              : dedupe([base, plain, shortTitle(plain, 3)]);
            if (type === 'series' && Number.isInteger(season) && Number.isInteger(episode)) {"""
          if old not in text:
            raise SystemExit('buildQueries anchor missing')
          text = text.replace(old, new, 1)

          old = """      if (!name || titleMatchScore(name, wantedTitles) < 0.45) return;
            const detailsUrl = absoluteUrl(href, SKTORRENT_SEARCH_URL);"""
          new = """      const score = titleMatchScore(name, wantedTitles);
            if (!name || !candidateYearMatches(name, wantedTitles) || score < 0.7) return;
            const detailsUrl = absoluteUrl(href, SKTORRENT_SEARCH_URL);"""
          if old not in text:
            raise SystemExit('search filter anchor missing')
          text = text.replace(old, new, 1)

          old = """  const rankedCandidates = [...candidates.values()].sort((a, b) =>
            candidateLanguagePriority(a.name) - candidateLanguagePriority(b.name)
          );
          const batches = await Promise.all(rankedCandidates.slice(0, 6).map(streamsFromSktorrentDetail));"""
          new = """  const rankedCandidates = [...candidates.values()].sort((a, b) => {
            const languageDiff = candidateLanguagePriority(a.name) - candidateLanguagePriority(b.name);
            if (languageDiff) return languageDiff;
            return titleMatchScore(b.name, titles) - titleMatchScore(a.name, titles);
          });
          const batches = await Promise.all(rankedCandidates.slice(0, 6).map(streamsFromSktorrentDetail));"""
          if old not in text:
            raise SystemExit('ranking anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text)

          addon = Path('addon.js')
          addon_text = addon.read_text()
          if 'direct-detail-v6:' not in addon_text:
            raise SystemExit('addon cache key anchor missing')
          addon.write_text(addon_text.replace('direct-detail-v6:', 'direct-detail-v7:', 1))
          PY

          node --check api/sktonline.js
          node --check addon.js
          git diff --check
          git config user.name 'CaseyCZ automation'
          git config user.email 'actions@users.noreply.github.com'
          git add api/sktonline.js addon.js
          git commit -m 'Match SKTorrent releases by exact movie year'
          git push origin HEAD:Master
