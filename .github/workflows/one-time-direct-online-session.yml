name: One-time SKTOnline session repair

on:
  push:
    branches: [Master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply direct session patch
        run: python scripts/patch_direct_online_session.py
      - name: Syntax check
        run: |
          node --check api/sktonline.js
          node --check addon.js
      - name: Commit repair and cleanup
        shell: bash
        run: |
          rm -f scripts/patch_direct_online_session.py .github/workflows/one-time-direct-online-session.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sktonline.js scripts/patch_direct_online_session.py .github/workflows/one-time-direct-online-session.yml
          git commit -m "Use current SKTOnline session and flexible video paths"
          git push
