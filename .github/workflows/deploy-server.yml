name: Deploy SKTOnline to server

on:
  push:
    branches:
      - Master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stremio-sktonline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, dashboard]
    timeout-minutes: 15

    steps:
      - name: Deploy on Oracle
        shell: bash
        run: |
          set -euo pipefail
          bash /home/ubuntu/stremio.sktonline/deploy-server.sh

      - name: Verify service and deployed commit
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/stremio.sktonline
          node --check addon.js
          node --check api/cinemeta.js
          node --check api/csfd.js
          node --check api/sktonline.js
          node --check api/sktorrent.js
          SERVER_SHA="$(git rev-parse HEAD)"
          echo "SERVER_SHA=$SERVER_SHA"
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$SERVER_SHA" = "$GITHUB_SHA"
          curl -fsS http://127.0.0.1:7003/health

      - name: Deployment summary
        run: |
          {
            echo "### Deploy SKTOnline on Oracle runner"
            echo
            echo "- GitHub commit: \`${GITHUB_SHA}\`"
            echo "- Runner: \`oracle-dashboard\`"
            echo "- PM2 process: \`stremio-sktonline\`"
            echo "- Local port: \`7003\`"
            echo "- Result: deployment completed and verified"
          } >> "$GITHUB_STEP_SUMMARY"
