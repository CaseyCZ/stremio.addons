name: Deploy Stremio Addons to Oracle

on:
  push:
    branches:
      - Master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stremio-addons
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle
    if: github.ref == 'refs/heads/Master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require SSH deployment key
        env:
          DEPLOY_KEY_B64: ${{ secrets.ADDONS_DEPLOY_SSH_KEY_B64 }}
        run: |
          if [[ -z "$DEPLOY_KEY_B64" ]]; then
            echo "::error::Automatic deployment is not configured. Add repository secret ADDONS_DEPLOY_SSH_KEY_B64 (base64 encoded private SSH key authorized for ubuntu on Oracle)."
            exit 1
          fi

      - name: Configure SSH with pinned server identity
        env:
          DEPLOY_KEY_B64: ${{ secrets.ADDONS_DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          ssh-keygen -y -f ~/.ssh/deploy-key >/dev/null

          ssh-keyscan -T 10 -p 22 130.61.49.108 > /tmp/stremio-addons-host-keys 2>/dev/null
          test -s /tmp/stremio-addons-host-keys
          if ! ssh-keygen -lf /tmp/stremio-addons-host-keys | awk '{print $2}' | grep -Fxq 'SHA256:SHoVgKDg5pnIiJP70GQCO90OZTECuaNlKnfLK/WZF5Y'; then
            echo "::error::Oracle SSH host fingerprint does not match the pinned identity."
            exit 1
          fi
          cat /tmp/stremio-addons-host-keys >> ~/.ssh/known_hosts

      - name: Deploy unified Addons from Master
        run: |
          ssh \
            -i ~/.ssh/deploy-key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            ubuntu@130.61.49.108 \
            'bash /home/ubuntu/stremio.addons/deploy-server.sh'

      - name: Verify Addons and Bombuj on Oracle
        run: |
          ssh \
            -i ~/.ssh/deploy-key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ubuntu@130.61.49.108 \
            'set -e; cd /home/ubuntu/stremio.addons; test "$(git rev-parse HEAD)" = "$(git rev-parse origin/Master)"; curl -fsS --max-time 10 http://127.0.0.1:7003/health >/dev/null; curl -fsS --max-time 10 http://127.0.0.1:7004/manifest.json >/dev/null'
          echo "Oracle Addons deployment and both provider services verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/deploy-key /tmp/stremio-addons-host-keys
