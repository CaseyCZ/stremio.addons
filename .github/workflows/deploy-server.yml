name: Deploy SKTOnline to server

on:
  push:
    branches:
      - Master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stremio-sktonline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, dashboard]
    timeout-minutes: 15

    steps:
      - name: Deploy on Oracle
        run: |
          set -euo pipefail
          bash /home/ubuntu/stremio.sktonline/deploy-server.sh

      - name: Deployment summary
        run: |
          {
            echo "### Deploy SKTOnline on self-hosted Oracle runner"
            echo
            echo "- GitHub commit: \`${GITHUB_SHA}\`"
            echo "- Runner: \`oracle-dashboard\`"
            echo "- PM2 process: \`stremio-sktonline\`"
            echo "- Local port: \`7003\`"
            echo "- Result: deployment completed successfully"
          } >> "$GITHUB_STEP_SUMMARY"
