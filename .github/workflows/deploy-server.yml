name: Validate and deploy Stremio Addons

on:
  push:
    branches:
      - Master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stremio-addons
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate addon
        run: |
          set -euo pipefail
          npm install --omit=dev --no-audit --no-fund
          npm run version:check
          node --check addon.js
          node --check api/cinemeta.js
          node --check api/csfd.js
          node --check api/sktonline.js
          node --check api/sktorrent.js
          node --check api/sosac-overlay.js
          node --check api/bombuj-overlay.js
          node --check api/bombuj-bridge.js
          npm test
          node --check api/prehrajto.js
          if [[ -f providers/bombuj/package.json ]]; then
            npm install --prefix providers/bombuj --omit=dev --no-audit --no-fund --ignore-scripts
            npm --prefix providers/bombuj run check
            PORT=17235 node providers/bombuj/preflight-front.js >/tmp/caseycz-bombuj-monorepo-smoke.log 2>&1 &
            BOMBUJ_PID=$!
            for attempt in $(seq 1 35); do
              if curl -fsS --max-time 3 http://127.0.0.1:17235/manifest.json >/tmp/caseycz-bombuj-monorepo-manifest.json; then break; fi
              sleep 1
            done
            node -e "const m=require('/tmp/caseycz-bombuj-monorepo-manifest.json');if(!m.catalogs?.some(x=>x.type==='series')||!m.catalogs?.some(x=>x.type==='movie'))throw Error('Imported Bombuj startup lost catalog resources');console.log('Imported Bombuj server: movie + series manifest OK')"
            kill "$BOMBUJ_PID" 2>/dev/null || true
          fi
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/configure.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!script) throw Error('Missing UI JavaScript');
          new vm.Script(script[1], {filename:'configure-inline.js'});
          if (!html.includes('/bombuj/manifest.json')) throw Error('Bombuj configured manifest link is missing');
          if (!html.includes('id="uiLanguage"') || !html.includes('id="sosacSettings"')) throw Error('Settings controls missing');
          if (!html.includes("button.disabled=addon==='sktorrent'")) throw Error('Torrent button state missing');
          if (!html.includes('refreshTorrent();')) throw Error('Missing SKTorrent credential validation');
          for (const id of ['sktonline','sktorrent','bombuj']) {
            if (!html.includes('id="'+id+'"')) throw Error('Missing card '+id);
          }
          console.log('Shared config UI: three addon cards and valid JavaScript');
          NODE
          node - <<'NODE' >/tmp/caseycz-mock-bombuj.log 2>&1 &
          const http=require('node:http');
          const manifest={
            id:'community.caseycz.bombuj',version:'0.8.1',name:'Bombuj',
            types:['movie','series'],
            resources:[
              {name:'catalog',types:['movie','series']},
              {name:'meta',types:['movie','series'],idPrefixes:['bombuj-series-']},
              {name:'stream',types:['movie','series'],idPrefixes:['tt','bombuj-series-']},
              {name:'subtitles',types:['movie','series'],idPrefixes:['tt','bombuj-series-']}
            ],
            catalogs:[{type:'series',id:'bombuj-series-search',name:'🔎 Bombuj – Hledat seriály',extra:[{name:'search',isRequired:true}]}]
          };
          http.createServer((req,res)=>{
            res.setHeader('Content-Type','application/json');
            if(req.url==='/manifest.json')return res.end(JSON.stringify(manifest));
            if(req.url==='/stream/series/tt1954804:1:1.json')return res.end(JSON.stringify({streams:[{name:'Bombuj Test',externalUrl:'https://example.com/embed/test'}]}));
            if(req.url==='/catalog/series/bombuj-series-search/search=Hope.json')return res.end(JSON.stringify({metas:[{id:'bombuj-series-saving-hope',name:'Saving Hope'}]}));
            res.statusCode=404;res.end(JSON.stringify({error:'mock resource missing'}));
          }).listen(17234,'127.0.0.1');
          NODE
          MOCK_PID=$!
          CONFIG_ENCRYPTION_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa BOMBUJ_META_URL=http://127.0.0.1:17234 PORT=17233 node addon.js >/tmp/caseycz-staging-smoke.log 2>&1 &
          SMOKE_PID=$!
          trap 'kill "$SMOKE_PID" "$MOCK_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17233/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node - <<'NODE'
          (async () => {
            const base='http://127.0.0.1:17233';
            const request=(body)=>fetch(base+'/api/config-token',{
              method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
            });
            const direct=await request({addonType:'sktonline',uiLanguage:'cs'});
            if(!direct.ok) throw Error('Direct without login failed HTTP '+direct.status);
            const token=(await direct.json()).token;
            if(!token||!token.startsWith('enc1.'))throw Error('No encrypted direct config');
            const installed=await fetch(base+'/'+token+'/manifest.json');
            const manifest=await installed.json();
            if(manifest.id!=='cz.caseycz.stremio.sktonline.direct')throw Error('Wrong Direct identity');
            if(manifest.name!=='SKTOnline Direct')throw Error('Wrong Direct label');
            if(!manifest.idPrefixes.includes('bombuj-series-'))throw Error('Bombuj ID missing');
            const tor=await request({addonType:'sktorrent',uiLanguage:'cs'});
            if(tor.status!==400)throw Error('Uncredentialed SKTorrent was accepted');
            const configured=await request({addonType:'bombuj',uiLanguage:'cs',sosacUsername:'testaccount',sosacPassword:'testpassword'});
            if(!configured.ok)throw Error('Optional Bombuj config rejected: '+configured.status);
            const bombujToken=(await configured.json()).token;
            const bridgeManifestResponse=await fetch(base+'/'+bombujToken+'/bombuj/manifest.json');
            const bridgeManifest=await bridgeManifestResponse.json();
            if(bridgeManifest.id!=='cz.caseycz.stremio.bombuj.unified')throw Error('Wrong Bombuj ID');
            if(bridgeManifest.catalogs[0].id!=='bombuj-series-search')throw Error('Bombuj catalog missing');
            const prefixes=bridgeManifest.resources.find(x=>x.name==='stream').idPrefixes;
            if(!prefixes.includes('sosac_ep_'))throw Error('Sosac episode overlay unavailable for Bombuj');
            const forwarded=await fetch(base+'/'+bombujToken+'/bombuj/stream/series/tt1954804:1:1.json').then(r=>r.json());
            if(forwarded.streams?.length!==1)throw Error('Bombuj stream forwarding failed');
            const found=await fetch(base+'/'+bombujToken+'/bombuj/catalog/series/bombuj-series-search/search=Hope.json').then(r=>r.json());
            if(found.metas?.[0]?.name!=='Saving Hope')throw Error('Bombuj catalog forwarding failed');
            console.log('Direct, protected Torrent, and configured Bombuj JSON routes verified');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          bash -n deploy-bombuj-runtime.sh
          bash -n scripts/migrate-pm2-unified-names.sh
          node scripts/test-pm2-name-contract.cjs
          node --check ecosystem.bombuj.config.cjs
          node -e "for(const file of ['./ecosystem.config.js','./ecosystem.bombuj.config.cjs'])if(require(file).apps[0].env.RUNNER_TRACKING_ID!=='')throw Error('Persistent PM2 app must clear runner tracking')"
          node -e "const p=require('./ecosystem.bombuj.config.cjs').apps[0];if(p.name!=='stremio-addons-bombuj'||p.env.PORT!=='7004'||!p.cwd.endsWith('/providers/bombuj'))throw Error('Wrong unified Bombuj PM2 definition')"
          bash -n deploy-server.sh

      - name: Deployment note
        run: |
          {
            echo "### SKTOnline source validation"
            echo
            echo "- GitHub commit: \`${GITHUB_SHA}\`"
            echo "- Source validation: passed"
            echo "- Oracle deployment: follows in the SSH deploy job"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Oracle
    needs: validate
    if: github.ref == 'refs/heads/Master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require SSH deployment key
        env:
          DEPLOY_KEY_B64: ${{ secrets.ADDONS_DEPLOY_SSH_KEY_B64 }}
        run: |
          if [[ -z "$DEPLOY_KEY_B64" ]]; then
            echo "::error::Automatic deployment is not configured. Add repository secret ADDONS_DEPLOY_SSH_KEY_B64 (base64 encoded private SSH key authorized for ubuntu on Oracle)."
            exit 1
          fi

      - name: Configure SSH with pinned server identity
        env:
          DEPLOY_KEY_B64: ${{ secrets.ADDONS_DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          ssh-keygen -y -f ~/.ssh/deploy-key >/dev/null

          ssh-keyscan -T 10 -p 22 130.61.49.108 > /tmp/stremio-addons-host-keys 2>/dev/null
          test -s /tmp/stremio-addons-host-keys
          if ! ssh-keygen -lf /tmp/stremio-addons-host-keys | awk '{print $2}' | grep -Fxq 'SHA256:SHoVgKDg5pnIiJP70GQCO90OZTECuaNlKnfLK/WZF5Y'; then
            echo "::error::Oracle SSH host fingerprint does not match the pinned identity."
            exit 1
          fi
          cat /tmp/stremio-addons-host-keys >> ~/.ssh/known_hosts

      - name: Deploy unified Addons from Master
        run: |
          ssh \
            -i ~/.ssh/deploy-key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            ubuntu@130.61.49.108 \
            'bash /home/ubuntu/stremio.addons/deploy-server.sh'

      - name: Verify Addons and Bombuj on Oracle
        run: |
          ssh \
            -i ~/.ssh/deploy-key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ubuntu@130.61.49.108 \
            'set -e; cd /home/ubuntu/stremio.addons; test "$(git rev-parse HEAD)" = "$(git rev-parse origin/Master)"; curl -fsS --max-time 10 http://127.0.0.1:7003/health >/dev/null; curl -fsS --max-time 10 http://127.0.0.1:7004/manifest.json >/dev/null'
          echo "Oracle Addons deployment and both provider services verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/deploy-key /tmp/stremio-addons-host-keys
