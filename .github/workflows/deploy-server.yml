name: Validate SKTOnline source

on:
  push:
    branches:
      - Master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stremio-sktonline
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate addon
        run: |
          set -euo pipefail
          npm install --omit=dev --no-audit --no-fund
          npm run version:check
          node --check addon.js
          node --check api/cinemeta.js
          node --check api/sktonline.js
          node --check api/sktorrent.js

      - name: Deployment note
        run: |
          {
            echo "### SKTOnline validation"
            echo
            echo "- GitHub commit: \`${GITHUB_SHA}\`"
            echo "- Source validation: passed"
            echo "- Server deployment: handled automatically by the Oracle dashboard runner"
            echo "- Maximum normal delay: about 5 minutes"
          } >> "$GITHUB_STEP_SUMMARY"
