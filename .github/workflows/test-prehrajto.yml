name: Validate Stremio Addons syntax

on:
  push:
    branches:
      - Master
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.json'
      - '**/*.sh'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.json'
      - '**/*.sh'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-stremio-addons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript and shell syntax
        run: |
          set -euo pipefail
          for file in addon.js api/*.js providers/bombuj/*.js ecosystem.config.js ecosystem.bombuj.config.cjs; do
            if [[ -f "$file" ]]; then
              node --check "$file"
            fi
          done
          bash -n deploy-server.sh deploy-bombuj-runtime.sh scripts/*.sh
