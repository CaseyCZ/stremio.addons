name: SKTOnline videoId source bundle v0.1.7

on:
  push:
    branches: [Master]
    paths:
      - scripts/patch-videoid-source-bundle-v017.py
      - .github/workflows/one-time-videoid-source-bundle-v017.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-videoid-source-bundle-v017.py
      - name: Validate
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm run version:check
          node --check addon.js
          node --check api/sktonline.js
          node --check api/sosac-overlay.js
          node - <<'NODE'
          const api = require('./api/sktonline');
          if (typeof api.findOnlineSourceBundle !== 'function') {
            throw new Error('findOnlineSourceBundle export missing');
          }
          console.log('findOnlineSourceBundle export OK');
          NODE
      - name: Commit and cleanup
        run: |
          rm -f scripts/patch-videoid-source-bundle-v017.py
          rm -f .github/workflows/one-time-videoid-source-bundle-v017.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Share SKTOnline videoId between streams and subtitles"
          git push
