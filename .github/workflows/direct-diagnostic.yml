name: Temporary direct stream diagnostic

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/direct-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Locate SKTorrent Play Video controls
        run: |
          node <<'NODE'
          const axios=require('axios');
          const cheerio=require('cheerio');
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36';
          const base='https://sktorrent.eu';
          (async()=>{
            const r=await axios.get(base+'/torrent/torrents_v2.php',{timeout:15000,params:{search:'Barbie',category:0,active:0,order:'data',by:'DESC',page:0},headers:{'User-Agent':UA,'Accept-Encoding':'identity',Referer:base+'/torrent/torrents_v2.php'}});
            const html=String(r.data||''); const $=cheerio.load(html);
            console.log('SEARCH',r.status,'bytes',html.length);
            const controls=[];
            $('a,button,img,input,[onclick],[data-url],[data-href]').each((_,el)=>{
              const n=$(el); const attrs={};
              for(const a of ['href','src','title','alt','onclick','data-url','data-href','class','id']){const v=n.attr(a);if(v)attrs[a]=String(v).slice(0,500);}
              const text=n.text().replace(/\s+/g,' ').trim().slice(0,250);
              const blob=JSON.stringify(attrs)+' '+text;
              if(/play\s*video|fa-play|glyphicon-play|online\d*\.sktorrent|online\.sktorrent|sledujteto|stream|embed/i.test(blob)) controls.push({tag:el.tagName,text,attrs});
            });
            console.log('CONTROLS',JSON.stringify(controls.slice(0,80)));
            for(const needle of ['Play Video','play_video','fa-play','online.sktorrent','embed']) {
              let pos=0,count=0;
              while((pos=html.toLowerCase().indexOf(needle.toLowerCase(),pos))>=0 && count<12){console.log('AROUND',needle,html.slice(Math.max(0,pos-450),Math.min(html.length,pos+900)).replace(/\s+/g,' '));pos+=needle.length;count++;}
              console.log('COUNT',needle,count);
            }
          })().catch(e=>{console.error('DIAG_ERROR',e.message,e.response?.status||'');process.exitCode=1;});
          NODE
