name: Temporary direct stream diagnostic

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/direct-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Inspect SKTOnline frontend endpoints
        run: |
          node <<'NODE'
          const axios=require('axios');
          const cheerio=require('cheerio');
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36';
          const base='https://online.sktorrent.eu';
          (async()=>{
            const r=await axios.get(base+'/search/videos',{timeout:15000,params:{type:'public',t:'a',o:'mr',search_query:'Barbie',page:1},headers:{'User-Agent':UA,'Accept-Encoding':'identity',Referer:base+'/'}});
            const $=cheerio.load(r.data);
            const scripts=$('script[src]').map((_,e)=>new URL($(e).attr('src'),base).toString()).get();
            console.log('SCRIPTS',JSON.stringify(scripts));
            for(const url of scripts){
              try{
                const x=await axios.get(url,{timeout:12000,headers:{'User-Agent':UA,'Accept-Encoding':'identity',Referer:base+'/'}});
                const text=String(x.data||'');
                if(!/(embed|video|player|ajax|source|h264)/i.test(text)) continue;
                const snippets=[];
                for(const re of [/embed/ig,/video[_\/-]?id/ig,/player/ig,/ajax/ig,/h264/ig,/source/ig]){
                  let m,count=0; while((m=re.exec(text))&&count<8){snippets.push(text.slice(Math.max(0,m.index-300),Math.min(text.length,m.index+700)).replace(/\s+/g,' '));count++;}
                }
                console.log('SCRIPT_MATCH',url,'bytes',text.length,JSON.stringify([...new Set(snippets)].slice(0,15)));
              }catch(e){console.log('SCRIPT_ERR',url,e.message,e.response?.status||'');}
            }
            const inline=$('script:not([src])').map((_,e)=>$(e).html()||'').get().join('\n');
            const hits=[];
            for(const re of [/embed/ig,/video/ig,/player/ig,/ajax/ig]){let m,c=0;while((m=re.exec(inline))&&c<10){hits.push(inline.slice(Math.max(0,m.index-250),Math.min(inline.length,m.index+650)).replace(/\s+/g,' '));c++;}}
            console.log('INLINE',JSON.stringify([...new Set(hits)].slice(0,20)));
          })().catch(e=>{console.error('DIAG_ERROR',e.message,e.response?.status||'');process.exitCode=1;});
          NODE
