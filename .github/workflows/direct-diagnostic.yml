name: Temporary direct stream diagnostic

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/direct-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Test canonical SKTOnline paths
        run: |
          node <<'NODE'
          const axios=require('axios');
          const cheerio=require('cheerio');
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36';
          const base='https://online.sktorrent.eu';
          const cookies={};
          const absorb=r=>{for(const x of (r.headers['set-cookie']||[])){const p=String(x).split(';')[0],i=p.indexOf('=');if(i>0)cookies[p.slice(0,i)]=p.slice(i+1);}};
          const cookie=()=>Object.entries(cookies).map(([k,v])=>`${k}=${v}`).join('; ');
          const h=ref=>({'User-Agent':UA,'Accept-Encoding':'identity',Accept:'text/html,application/xhtml+xml,*/*',Referer:ref,...(cookie()?{Cookie:cookie()}: {})});
          const show=(name,r)=>{const text=String(r.data||''),$=cheerio.load(text);console.log(name,JSON.stringify({status:r.status,final:r.request?.res?.responseUrl,bytes:text.length,title:$('title').text().trim(),video:$('video').length,sources:$('video source[src],source[src],video[src]').map((_,e)=>$(e).attr('src')).get().slice(0,8),location:r.headers.location||''}));};
          (async()=>{
            const home=await axios.get(base+'/',{timeout:15000,headers:h(base+'/')});absorb(home);
            const s=await axios.get(base+'/search/videos',{timeout:15000,params:{type:'public',t:'a',o:'mr',search_query:'Barbie',page:1},headers:h(base+'/')});absorb(s);
            const $=cheerio.load(s.data); const a=$("a[href*='/video/']").filter((_,e)=>/barbie/i.test($(e).attr('href')||'')).first();
            const href=a.attr('href'); const id=(href.match(/\/video\/(\d+)/)||[])[1]; const exact=new URL(href,base).toString(); const ref=s.request?.res?.responseUrl||base+'/search/videos';
            console.log('TARGET',id,href);
            for(const [name,url] of [
              ['EXACT',exact],
              ['ID_NO_SLASH',base+'/video/'+id],
              ['ID_SLASH',base+'/video/'+id+'/'],
              ['ID_DOUBLE_SLASH',base+'/video/'+id+'//']
            ]){try{const r=await axios.get(url,{timeout:15000,headers:h(ref),maxRedirects:5,validateStatus:x=>x>=200&&x<500});absorb(r);show(name,r);}catch(e){console.log(name,'ERR',e.message,e.response?.status||'');}}
          })().catch(e=>{console.error('DIAG_ERROR',e.message,e.response?.status||'');process.exitCode=1;});
          NODE
