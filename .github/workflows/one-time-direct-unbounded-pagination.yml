name: One-time Direct complete pagination

on:
  push:
    branches: [Master]
    paths:
      - '.github/workflows/one-time-direct-unbounded-pagination.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove artificial Direct page cap
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('api/sktonline.js')
          s = p.read_text()
          s = s.replace("  const MAX_PAGES = 12;\n  let lastPage = 0;", "  let lastPage = 0;", 1)
          s = s.replace("for (let page = 0; page < MAX_PAGES && page <= lastPage; page += 1)", "for (let page = 0; page <= lastPage; page += 1)", 1)
          s = s.replace("lastPage = Math.min(MAX_PAGES - 1, Math.max(lastPage, Number(match[1])))", "lastPage = Math.max(lastPage, Number(match[1]))", 1)
          s = s.replace("directProviderWithin(findFromSktorrentDetails(queries, titles, imdbId, sktClient), 45000, 'SKTorrent detail players')", "directProviderWithin(findFromSktorrentDetails(queries, titles, imdbId, sktClient), 60000, 'SKTorrent detail players')", 1)
          p.write_text(s)
          PY
          node --check api/sktonline.js
      - name: Commit and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/one-time-direct-unbounded-pagination.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sktonline.js .github/workflows/one-time-direct-unbounded-pagination.yml
          git commit -m "Traverse all SKTorrent Direct result pages"
          git push
